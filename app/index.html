<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 跨源隔离垫片：GitHub Pages 无法设响应头，用 SW 客户端补 COOP/COEP 以启用 SharedArrayBuffer
         （onnxruntime-web wasm 多线程，OMR 识别 ~2x）。按 BASE_URL 取绝对路径（子路径部署与 /en/ 页共用一份，SW 作用域覆盖整站）；Tauri/dev 已原生发头
         → 页面已隔离 → 脚本自动跳过。首次访问会自动多刷新一次。 -->
    <script src="%BASE_URL%coi-serviceworker.js"></script>

    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%nota-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Nota" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="stylesheet" href="/src/styles.css" />

    <!-- seo:start -->
    <title>Nota · 家庭曲谱工作台</title>
    <meta name="description" content="和家人一起收藏、编辑与练习喜欢的曲子。支持简谱转换、移调、在线试听与 A4 打印。" />
    <meta name="theme-color" content="#0f0f0f" />
    <meta property="og:site_name" content="Nota" />
    <meta property="og:title" content="Nota · 家庭曲谱工作台" />
    <!-- seo:end -->

    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div id="app" class="is-starting">
      <header id="app-header">
        <div class="header-left">
          <button id="btn-home" class="button button-home" aria-label="返回开始" data-i18n-aria="header.home">
            <span class="button-symbol" aria-hidden="true">←</span><span class="home-label" data-i18n="header.home">返回开始</span>
          </button>
          <div class="brand" aria-label="Nota" data-i18n-aria="header.brandAria">
            <img class="brand-mark" src="%BASE_URL%favicon.svg" alt="" width="30" height="30" aria-hidden="true" />
            <span class="brand-name">Nota</span>
            <span class="brand-subtitle" data-i18n="header.subtitle">家庭曲谱工作台</span>
          </div>
        </div>
        <div class="header-actions">
          <!-- 应用级的四项：宽屏排在顶栏，手机宽度收进「⋯」（toolpop.ts） -->
          <button id="btn-header-more" class="button button-tool header-more" aria-expanded="false" aria-controls="header-tools" title="更多" aria-label="更多" data-i18n-title="header.more" data-i18n-aria="header.more">⋯</button>
          <div id="header-tools" class="header-tools">
            <button id="btn-parts" class="button button-tool" title="声部：增删、排序、改名、谱号、拆合闭合谱、歌词复制；试听静音 / 独奏 / 音量" data-i18n-title="toolbar.parts.title" data-i18n="toolbar.parts">声部</button>
            <button id="btn-hanzi" class="button button-tool" title="整篇转换源码中的中文（简体 ⇄ 繁体）" data-i18n-title="toolbar.hanzi.title" data-i18n="toolbar.hanzi">简繁</button>
            <button id="btn-options" class="button button-tool" data-i18n="toolbar.options">设置</button>
            <button id="btn-help" class="button button-tool" title="功能帮助、123 格式与记谱法说明" data-i18n-title="toolbar.help.title" data-i18n="toolbar.help">帮助</button>
          </div>
          <span class="header-divider" aria-hidden="true"></span>
          <button id="btn-save" class="button button-secondary" data-i18n="header.save">保存到曲谱库</button>
          <button id="btn-saveas" class="button button-secondary" data-i18n="header.saveAs">另存为</button>
          <button id="btn-export" class="button button-primary" data-i18n="header.export">导出</button>
        </div>
      </header>

      <div id="toolbar" aria-label="乐谱工具栏" data-i18n-aria="toolbar.aria">
        <div id="layout-tools" class="tool-group context-tool-group" hidden>
          <span class="tool-label" data-i18n="toolbar.lines">分行</span>
          <div id="layout-mode-switch" class="layout-mode-switch" data-context-control aria-label="分行方式" data-i18n-aria="toolbar.linesAria" hidden>
            <button id="btn-layout-original" class="active" aria-pressed="true" title="保留导入或识别时的行结构" data-i18n-title="toolbar.layoutOriginal.title" data-i18n="toolbar.layoutOriginal">原始排版</button>
            <button id="btn-phrase" aria-pressed="false" title="根据歌词和音乐乐句重新安排换行" data-i18n-title="toolbar.phrase.title" data-i18n="toolbar.phrase">按乐句重排</button>
          </div>
        </div>
        <div id="recognition-tools" class="tool-group context-tool-group" hidden>
          <span class="tool-label" data-i18n="toolbar.recogGroup">识别</span>
          <button id="btn-src-pages" data-context-control title="这次识别用的原图：调顺序、删减、加图、旋转、裁剪，再按这些页重新识别" data-i18n-title="toolbar.srcPages.title" data-i18n="toolbar.srcPages" hidden>原图页</button>
          <label id="recog-kind-field" class="toolbar-select-field" data-context-control hidden>
            <span class="sr-only" data-i18n="toolbar.recogKind">识别类型</span>
            <select id="sel-recog-kind" title="识别为：自动判断 / 简谱 / 五线谱。改了就用刚才那份图重新识别" aria-label="识别类型" data-i18n-title="toolbar.recogKind.title" data-i18n-aria="toolbar.recogKind">
              <option value="auto" data-i18n="recogKind.auto">自动判断</option>
              <option value="jianpu" data-i18n="recogKind.jianpuAs">按简谱识别</option>
              <option value="staff" data-i18n="recogKind.staffAs">按五线谱识别</option>
            </select>
            <span class="select-chevron" aria-hidden="true">⌄</span>
          </label>
        </div>
        <div class="tool-group context-tool-group playback-tools">
          <span class="tool-label" data-i18n="toolbar.listen">试听</span>
          <button id="btn-play" class="icon-text playback-button" aria-label="播放" data-i18n-aria="play.play">
            <span class="playback-icon" aria-hidden="true"><svg viewBox="0 0 10 10"><path d="M2 0.8 L9.2 5 L2 9.2 Z" fill="currentColor"/></svg></span>
            <span class="playback-label" data-i18n="play.play">播放</span>
          </button>
          <button id="btn-stop" class="icon-button playback-stop" title="停止试听（回到曲首）" aria-label="停止" data-i18n-title="play.stop.title" data-i18n-aria="play.stop" disabled><svg class="playback-stop-icon" viewBox="0 0 10 10" aria-hidden="true"><rect x="0.8" y="0.8" width="8.4" height="8.4" rx="1.2" fill="currentColor"/></svg></button>
          <input id="play-progress" class="play-progress" type="range" min="0" max="1" step="any" value="0" aria-label="播放进度" data-i18n-aria="play.progress" disabled>
          <button id="play-time" class="play-time" aria-label="播放时间" data-i18n-aria="play.time">0:00 / 0:00</button>
          <label class="select-wrap">
            <select id="sel-speed" aria-label="播放速度" data-i18n-aria="play.speed"></select>
            <span class="select-chevron" aria-hidden="true">⌄</span>
          </label>
          <button id="btn-loop" class="playback-toggle" aria-pressed="false" title="循环播放：谱面上选了一段就循环这一段，没选循环整首" data-i18n-title="play.loop.title" data-i18n="play.loop">循环</button>
          <button id="btn-metronome" class="playback-toggle" aria-pressed="false" title="节拍器：试听时每拍响一声（小节第一拍高一些）" data-i18n-title="play.metronome.title" data-i18n="play.metronome">节拍</button>
        </div>
        <span class="toolbar-spacer"></span>
        <div class="tool-group mobile-view-switch" aria-label="移动端工作区视图" data-i18n-aria="toolbar.mobileView">
          <button id="btn-mobile-code" aria-pressed="false" data-i18n="toolbar.mobileCode">源码</button>
          <button id="btn-mobile-score" class="active" aria-pressed="true" data-i18n="toolbar.mobileScore">预览</button>
        </div>
      </div>

      <div id="body">
        <section id="code-pane-shell" class="workspace-pane" aria-label="乐谱源码" data-i18n-aria="pane.code">
          <div class="pane-heading">
            <span data-i18n="pane.code">乐谱源码</span>
            <span id="code-pane-meta" class="pane-meta">JPWABC</span>
            <!-- 源码格式下拉：就在格式标签这个位置换着显示（识别结果、打开的文件都能切，顶掉标签） -->
            <label id="doc-format-field" class="pane-select-field" data-context-control hidden>
              <span class="sr-only" data-i18n="pane.docFormat">源码格式</span>
              <select id="sel-doc-format" title="切换源码格式（识别结果不重新识别；打开的文件切回「原文」可还原）" aria-label="源码格式" data-i18n-title="pane.docFormat.title" data-i18n-aria="pane.docFormat"></select>
              <span class="select-chevron" aria-hidden="true">⌄</span>
            </label>
          </div>
          <div id="code-pane"></div>
        </section>
        <section id="score-pane-shell" class="workspace-pane" aria-label="排版" data-i18n-aria="pane.score">
          <div class="pane-heading">
            <span data-i18n="pane.score">排版</span>
            <div class="pane-heading-actions">
              <span id="visual-mode" class="visual-mode" title="可视化编辑：编辑模式（方块光标）改选中的元素，插入模式（竖线光标）在光标处插入；Insert / Esc 切换" data-i18n-title="pane.visualMode.title" hidden>编辑</span>
              <button id="btn-palette" class="palette-button" aria-pressed="false" title="记号面板：用鼠标点唱名、八度、时值、记号、换行" data-i18n-title="pane.palette.title" data-i18n="pane.palette">面板</button>
              <button id="btn-beat-check" class="beat-check-button" aria-pressed="true" title="小节时值自检：拍数与拍号对不上的小节标红" data-i18n-title="pane.beatCheck.title" data-i18n="pane.beatCheck">拍</button>
              <button id="btn-format-marks" class="format-marks-button" aria-pressed="true" title="显示格式标记：换行符 ↵ 与换页符 ⤓（Ctrl/⌘+Shift+M）" data-i18n-title="pane.formatMarks.title">¶</button>
              <div id="view-mode-switch" class="preview-mode-switch" aria-label="排版模式" data-i18n-aria="view.aria">
                <button id="btn-view-expanded" class="active" aria-pressed="true" title="反复与多段歌词逐段展开，一段一页（投影用）" data-i18n-title="view.expanded.title" data-i18n="view.expanded">展开</button>
                <button id="btn-view-original" aria-pressed="false" title="按原谱排一遍，多段歌词叠排、反复不展开" data-i18n-title="view.original.title" data-i18n="view.original">原样</button>
                <button id="btn-view-staff" aria-pressed="false" title="五线谱（需有 MusicXML 底本）" data-i18n-title="view.staff.title" data-i18n="view.staff">五线谱</button>
                <button id="btn-view-mixed" aria-pressed="false" title="五线谱叠加简谱层（需有 MusicXML 底本）" data-i18n-title="view.mixed.title" data-i18n="view.mixed">混排</button>
              </div>
            </div>
          </div>
          <div id="visual-palette" class="visual-palette" aria-label="记号面板" data-i18n-aria="pane.paletteAria" hidden></div>
          <div id="score-pane"></div>
          <div id="omr-follow" class="omr-follow" hidden></div>
          <div id="omr-side" class="omr-side" hidden></div>
        </section>

        <section id="start-screen" aria-labelledby="start-title">
          <div class="start-content">
            <div class="start-heading">
              <span class="eyebrow" data-i18n="start.eyebrow">开始创作</span>
              <h1 id="start-title" data-i18n="start.title">Nota</h1>
              <p data-i18n="start.lead">A simple way to make sheet music.</p>
            </div>
            <div class="start-modes">
              <button id="btn-start-image" class="start-mode start-mode-primary">
                <span class="mode-icon" aria-hidden="true">
                  <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M24 10.6667C24 12.1394 22.8061 13.3333 21.3333 13.3333C19.8605 13.3333 18.6667 12.1394 18.6667 10.6667C18.6667 9.19391 19.8605 8 21.3333 8C22.8061 8 24 9.19391 24 10.6667Z" fill="#fff"/>

                  </svg>
                </span>
                <span class="mode-copy">
                  <strong data-i18n="start.image">图片识谱</strong>
                  <span data-i18n="start.image.sub">上传图片，自动识别</span>
                  <small>PNG · JPG · WEBP · PDF</small>
                </span>
                <span class="mode-arrow" aria-hidden="true">→</span>
              </button>
              <button id="btn-start-score" class="start-mode">
                <span class="mode-icon mode-icon-score" aria-hidden="true">
                  <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M11.3465 2.66668H20.6533C20.9633 2.6666 21.2009 2.66655 21.4087 2.68687C22.8857 2.83136 24.0948 3.71944 24.6075 4.91571H7.39237C7.90505 3.71944 9.11407 2.83136 10.5912 2.68687C10.7989 2.66655 11.0365 2.6666 11.3465 2.66668Z" fill="#333"/>
                    <path d="M8.41403 6.29749C6.55985 6.29749 5.03951 7.41716 4.53213 8.90255C4.52156 8.93351 4.51141 8.96464 4.50172 8.99591C5.03259 8.83515 5.58508 8.73012 6.14436 8.65843C7.58487 8.47375 9.40532 8.47384 11.52 8.47396H20.7095C22.8241 8.47384 24.6447 8.47375 26.0852 8.65843C26.6444 8.73012 27.1969 8.83515 27.7277 8.99591C27.7181 8.96464 27.708 8.93351 27.6973 8.90255C27.19 7.41716 25.6696 6.29749 23.8155 6.29749H8.41403Z" fill="#333"/>
                    <path d="M15 22.6667C15 22.1144 14.5523 21.6667 14 21.6667C13.4477 21.6667 13 22.1144 13 22.6667C13 23.2189 13.4477 23.6667 14 23.6667C14.5523 23.6667 15 23.2189 15 22.6667Z" fill="#333"/>
                    <path fill-rule="evenodd" clip-rule="evenodd" d="M11.5632 10.0561H20.4368C24.9365 10.0561 27.1864 10.0561 28.4503 11.3718C29.714 12.6876 29.4167 14.7205 28.822 18.7861L28.258 22.6415C27.7916 25.8299 27.5585 27.424 26.3623 28.3787C25.166 29.3333 23.4016 29.3333 19.8728 29.3333H12.1271C8.5984 29.3333 6.83404 29.3333 5.63779 28.3787C4.44153 27.424 4.20835 25.8299 3.74197 22.6415L3.17801 18.7861C2.58331 14.7204 2.28596 12.6876 3.54976 11.3718C4.81356 10.0561 7.06344 10.0561 11.5632 10.0561ZM17 14C17 13.4477 16.5523 13 16 13C15.4477 13 15 13.4477 15 14V19.8373C14.6872 19.7268 14.3507 19.6667 14 19.6667C12.3431 19.6667 11 21.0099 11 22.6667C11 24.3235 12.3431 25.6667 14 25.6667C15.6568 25.6667 17 24.3235 17 22.6667V17.7596C17.8936 18.4845 19.0156 19 20 19C20.5523 19 21 18.5523 21 18C21 17.4477 20.5523 17 20 17C19.5928 17 18.8193 16.7085 18.1113 16.0804C17.4205 15.4675 17 14.7181 17 14Z" fill="#333"/>
                  </svg>
                </span>
                <span class="mode-copy">
                  <strong data-i18n="start.score">导入乐谱</strong>
                  <span data-i18n="start.score.sub">继续编辑已有谱面</span>
                  <small data-i18n="start.score.formats">123 · JPWABC · jianpu-ly · 文本谱 · MusicXML · ABC</small>
                </span>
                <span class="mode-arrow" aria-hidden="true">→</span>
              </button>
            </div>
            <div class="start-footer">
              <span class="privacy-note"><span aria-hidden="true">●</span> <span data-i18n="start.privacy">在当前设备识谱，保存后与家人共享</span></span>
              <label class="start-kind"><span data-i18n="start.recogKind">识别为</span>
                <select id="sel-recog-kind-start" aria-label="识别类型" data-i18n-aria="toolbar.recogKind">
                  <option value="auto" data-i18n="recogKind.auto">自动判断</option>
                  <option value="jianpu" data-i18n="recogKind.jianpu">简谱</option>
                  <option value="staff" data-i18n="recogKind.staff">五线谱</option>
                </select>
              </label>
              <label class="start-kind" title="选好图之后先弹「原图页」：横着拍的转过来、页边裁掉、几张图排好顺序，再开始识别" data-i18n-title="start.adjustFirst.title">
                <input id="chk-adjust-first" type="checkbox"> <span data-i18n="start.adjustFirst">识别前先调整原图</span>
              </label>
              <div class="start-actions">
                <button id="btn-start-new" class="sample-link">新建空白谱</button>
                <button id="btn-start-sample" class="sample-link" data-i18n="start.sample">查看示例乐谱</button>
              </div>
            </div>
            <div id="start-feedback" hidden role="alert"></div>
          </div>
        </section>

        <div id="recognition-progress" hidden aria-live="polite">
          <div class="recognition-progress-card">
            <span class="progress-spinner" aria-hidden="true"></span>
            <div>
              <strong data-i18n="start.progress">正在识别并生成排版</strong>
              <span id="recognition-progress-detail" data-i18n="start.progress.sub">完成后将直接显示可编辑的乐谱</span>
            </div>
          </div>
        </div>
      </div>
      <footer id="statusbar" class="statusbar">
        <div id="status" class="status-text" role="status" aria-live="polite"></div>
        <div class="status-items">
          <span id="sel-info" class="sel-info" title="选中的元素：声部、第几小节第几拍、音高、时值" data-i18n-title="pane.selInfo.title" hidden></span>
          <span id="beat-count" class="beat-count" title="点一下跳到下一处" data-i18n-title="pane.beatCount.title" hidden></span>
          <button id="btn-doubt" class="doubt-count" title="识别时把握不大的音与歌词字（核对视图里黄框标出）：点一下跳到下一处" data-i18n-title="toolbar.doubt.title" hidden></button>
          <span class="status-sep status-sep-code" aria-hidden="true"></span>
          <label class="status-check" title="显示代码区（取消勾选收起，谱面占满；并排时原图与排版稿各占一半）" data-i18n-title="status.code.title">
            <input id="chk-code" type="checkbox" checked>
            <span data-i18n="status.code">源码</span>
          </label>
          <!-- 核对方式统一一个下拉（editor/comparemode.ts）：不核对、排版稿里的并排 / 片段、核对视图的三种叠加。
               下面隐藏的几个是它驱动的老控件（id 与接线不变，显隐仍表示「这一项现在能不能用」） -->
          <label id="compare-field" class="status-select-field" hidden>
            <span class="status-label" data-i18n="status.recogView">核对</span>
            <select id="sel-compare" title="核对方式" aria-label="核对方式" data-i18n-title="status.compare.title" data-i18n-aria="status.compare.aria">
              <option value="none" data-i18n="status.compare.none">不核对</option>
              <option value="side" data-i18n="toolbar.srcSide">并排原图</option>
              <option value="follow" data-i18n="toolbar.srcFollow">原图片段</option>
              <option value="floating" data-i18n="toolbar.recogView.floating">附近浮窗</option>
              <option value="inplace" data-i18n="toolbar.recogView.inplace">原位叠加</option>
              <option value="original" data-i18n="toolbar.recogView.original">仅原图</option>
            </select>
            <span class="select-chevron" aria-hidden="true">⌄</span>
          </label>
          <div class="compare-legacy" hidden>
            <button id="btn-recognize" data-context-control title="将识别结果与上传原图进行对照" data-i18n-title="toolbar.recognize.title" data-i18n="toolbar.recognize" hidden>原图对照</button>
            <button id="btn-src-side" data-context-control aria-pressed="false" title="排版稿左边铺整页原图：选中的音框出来，点原图上的音选中排版稿里那个" data-i18n-title="toolbar.srcSide.title" data-i18n="toolbar.srcSide" hidden>并排原图</button>
            <button id="btn-src-follow" data-context-control aria-pressed="false" title="在排版稿里选中音符时，右下角小窗显示原图上对应的那一行并框出这个音" data-i18n-title="toolbar.srcFollow.title" data-i18n="toolbar.srcFollow" hidden>原图片段</button>
            <label id="recog-view-field" class="status-select-field" data-context-control hidden>
              <span class="status-label" data-i18n="status.recogView">对照</span>
              <select id="sel-recog-view" title="原图对照方式" aria-label="原图对照方式" data-i18n-title="toolbar.recogView" data-i18n-aria="toolbar.recogView">
                <option value="floating" data-i18n="toolbar.recogView.floating">附近浮窗</option>
                <option value="inplace" data-i18n="toolbar.recogView.inplace">原位叠加</option>
                <option value="original" data-i18n="toolbar.recogView.original">仅原图</option>
              </select>
              <span class="select-chevron" aria-hidden="true">⌄</span>
            </label>
          </div>
          <span class="status-sep" aria-hidden="true"></span>
          <div class="tool-group">
            <span class="tool-label" data-i18n="toolbar.zoom">缩放</span>
            <button id="btn-zoom-out" class="icon-button" title="缩小 (Ctrl/⌘ -)" aria-label="缩小" data-i18n-title="toolbar.zoomOut.title" data-i18n-aria="toolbar.zoomOut">−</button>
            <button id="btn-zoom-reset" title="复位 (Ctrl/⌘ 0)" data-i18n-title="toolbar.zoomReset.title">100%</button>
            <button id="btn-zoom-in" class="icon-button" title="放大 (Ctrl/⌘ +)" aria-label="放大" data-i18n-title="toolbar.zoomIn.title" data-i18n-aria="toolbar.zoomIn">＋</button>
          </div>
          <div class="tool-group">
            <span class="tool-label" data-i18n="toolbar.page">页面</span>
            <button id="btn-prev" class="icon-button" title="上一页" aria-label="上一页" data-i18n-title="toolbar.prev" data-i18n-aria="toolbar.prev">‹</button>
            <button id="btn-next" class="icon-button" title="下一页" aria-label="下一页" data-i18n-title="toolbar.next" data-i18n-aria="toolbar.next">›</button>
          </div>
        </div>
      </footer>
      <footer id="nota-credit">Nota · Made with <a href="https://github.com/lodebar2026/dolce" target="_blank" rel="noopener noreferrer">Dolce</a></footer>
    </div>
    <!-- hidden off-screen svg used for getBBox/getComputedTextLength measurement -->
    <svg id="measure-svg" width="0" height="0" aria-hidden="true"></svg>
  </body>
</html>
